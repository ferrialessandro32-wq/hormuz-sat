name: Conteggio navi da satellite

on:
  schedule:
    - cron: "17 */6 * * *"   # ogni 6 ore: prende le nuove immagini appena disponibili
    - cron: "20 2 * * *"     # subito dopo il passaggio notturno di Sentinel-1 sul Golfo: fotografia AIS
    - cron: "20 14 * * *"    # subito dopo il passaggio pomeridiano: fotografia AIS
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scarica immagini e conta le navi
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: python sat_ships.py
      - name: Salva i risultati
        run: |
          git config user.name "sat-bot"
          git config user.email "sat-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Aggiorna conteggi satellitari"
          git push
